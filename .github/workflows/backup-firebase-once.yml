name: One-time backup live Firebase state

on:
  push:
    branches: [feat/v6-hardening]
    paths:
      - '.github/workflows/backup-firebase-once.yml'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v6-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture live Firestore document
        run: |
          node <<'NODE'
          const fs = require('fs');
          const endpoint = 'https://firestore.googleapis.com/v1/projects/chutemundobd/databases/(default)/documents/chuteMundo/sharedState';

          (async () => {
            const response = await fetch(endpoint, { headers: { Accept: 'application/json' } });
            if (!response.ok) throw new Error(`Firestore HTTP ${response.status}: ${await response.text()}`);
            const document = await response.json();
            const rawState = document?.fields?.state?.stringValue;
            if (!rawState) throw new Error('Firestore no devolvió fields.state.stringValue.');

            const state = JSON.parse(rawState);
            if (!Array.isArray(state.teams) || state.teams.length < 1) throw new Error('El respaldo no contiene equipos.');
            if (!Array.isArray(state.tournaments) || state.tournaments.length < 1) throw new Error('El respaldo no contiene torneos.');

            const snapshot = {
              capturedAt: new Date().toISOString(),
              source: endpoint,
              firestoreDocument: document.name || '',
              firestoreVersion: document?.fields?.version?.stringValue || '',
              updateTime: document.updateTime || '',
              teams: state.teams.length,
              tournaments: state.tournaments.length,
              matches: state.tournaments.reduce((sum, tournament) => sum + (tournament.matches?.length || 0), 0),
              state
            };

            fs.mkdirSync('backups', { recursive: true });
            fs.writeFileSync('backups/firebase-2026-09-29.json', JSON.stringify(snapshot, null, 2) + '\n');
            console.log('Firebase backup captured', {
              teams: snapshot.teams,
              tournaments: snapshot.tournaments,
              matches: snapshot.matches,
              updateTime: snapshot.updateTime
            });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit backup safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/firebase-2026-09-29.json
          if git diff --cached --quiet; then
            echo "Backup unchanged."
            exit 0
          fi
          git commit -m "Backup: capturar estado vivo de Firebase 2026-09-29"
          git pull --rebase origin feat/v6-hardening
          git push origin HEAD:feat/v6-hardening
