name: ChuteMundo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate architecture, syntax and fallback data
        shell: bash
        run: |
          set -euo pipefail
          npm run audit
          npm run check:data
          while IFS= read -r file; do node --check "$file"; done < <(find public -type f \( -name '*.mjs' -o -name '*.js' \) | sort)
          if find public/modules -type f -name '*.txt' -print -quit | grep -q .; then
            echo "No se permiten fragmentos .txt en el runtime."
            exit 1
          fi
          if grep -R -n -E "['\"\x60]/chute-v[0-9]" public/app.mjs public/modules; then
            echo "Se encontraron rutas versionadas antiguas en el runtime semántico."
            exit 1
          fi

      - name: Install browser test dependencies
        run: |
          npm install --no-save serve@14.2.4 playwright@1.65.1
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npx serve public -l 4173 --no-clipboard > /tmp/chute-server.log 2>&1 &
          sleep 3
          npm run smoke 2>&1 | tee /tmp/chute-smoke.log
          npm run smoke:responsive 2>&1 | tee /tmp/chute-responsive.log
          npm run smoke:experience 2>&1 | tee /tmp/chute-immersive.log
          npm run smoke:clicks 2>&1 | tee /tmp/chute-click-navigation.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chutemundo-ci-diagnostics
          path: |
            /tmp/chute-smoke.log
            /tmp/chute-responsive.log
            /tmp/chute-immersive.log
            /tmp/chute-click-navigation.log
            /tmp/chute-navigation-*.png
            /tmp/chute-6-2-*.png
            /tmp/chute-server.log
          retention-days: 7

      - name: Package validated production bundle
        if: github.ref == 'refs/heads/main' && success()
        run: |
          mkdir -p production-bundle
          cp -R public/. production-bundle/
          cp vercel.json production-bundle/
          find production-bundle -type f | sort > production-bundle-files.txt

      - name: Upload production bundle
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: chutemundo-production-bundle
          path: |
            production-bundle/**
            production-bundle-files.txt
          include-hidden-files: true
          retention-days: 14
