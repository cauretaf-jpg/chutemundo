name: Validate Chute Mundo 6

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/chutemundo-v6

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate architecture and JavaScript syntax
        run: |
          set -o pipefail
          npm run check:official
          while IFS= read -r file; do node --check "$file"; done < <(find public -type f \( -name '*.mjs' -o -name '*.js' \) | sort)
          node --check scripts/audit-v6.mjs
          node --check scripts/smoke-v6.mjs
          cat public/chute-v59-part-*.txt > /tmp/chute-v59-concatenated.mjs
          node --check /tmp/chute-v59-concatenated.mjs
          cat public/chute-v516-events-stats-part-*.txt > /tmp/chute-v516-concatenated.mjs
          node --check /tmp/chute-v516-concatenated.mjs
          cat public/chute-v517-finalization-part-*.txt > /tmp/chute-v517-concatenated.mjs
          node --check /tmp/chute-v517-concatenated.mjs
          cat public/chute-v521-history-part-*.txt > /tmp/chute-v521-concatenated.mjs
          node --check /tmp/chute-v521-concatenated.mjs

      - name: Validate Chute Mundo 6 files
        run: |
          test -s public/version.js
          test -s public/index.html
          test -s public/chute-official.mjs
          test -s public/chute-v6.mjs
          test -s public/chute-v6.css
          test -s public/sw.js
          test -s public/manifest.webmanifest
          test -s scripts/audit-v6.mjs
          test -s scripts/smoke-v6.mjs
          grep -q "CHUTE_APP_VERSION = '6.0.0'" public/version.js
          grep -q "/chute-v6.mjs" public/chute-official.mjs
          grep -q "data-chute-version=\"6.0.0\"" public/index.html
          ! grep -q "setInterval(refresh, 1500)" public/chute-v591-live-access.mjs
          ! test -e supabaseClient.js
          ! test -e supabase/schema.sql

      - name: Install browser
        run: |
          npm install --no-save serve@14.2.4 playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run Chute Mundo 6 browser smoke
        run: |
          npx serve public -l 4173 --no-clipboard > /tmp/chute-server.log 2>&1 &
          sleep 3
          node scripts/smoke-v6.mjs 2>&1 | tee /tmp/chute-smoke-v6.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chute-v6-diagnostics
          path: |
            /tmp/chute-smoke-v6.log
            /tmp/chute-server.log
          retention-days: 3
